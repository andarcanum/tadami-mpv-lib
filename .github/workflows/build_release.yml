name: Release

on:
  push:
    branches:
      - feature/mpv-0.41.0
    tags:
      - '1.19.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Install host dependencies
        timeout-minutes: 5
        run: |
          set -eux
          export DEBIAN_FRONTEND=noninteractive
          export NEEDRESTART_MODE=a
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 update || true
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Dpkg::Options::="--force-confold" install -y --no-install-recommends \
            autoconf pkg-config libtool ninja-build \
            python3-pip python3-setuptools python3-jsonschema \
            unzip nasm wget meson || true

      - name: Cache SDK / deps / prefixes
        uses: actions/cache@v4
        with:
          path: |
            buildscripts/sdk
            buildscripts/deps
            buildscripts/prefix
          key: mpv-${{ runner.os }}-${{ hashFiles('buildscripts/include/depinfo.sh', 'buildscripts/scripts/*.sh', 'buildscripts/patches/*', '.github/workflows/build_release.yml') }}
          restore-keys: |
            mpv-${{ runner.os }}-

      - name: Build
        run: |
          set -eux
          unset ANDROID_SDK_ROOT
          cd buildscripts
          # Release builds must not reuse a prefix built from other dependency pins.
          rm -rf prefix
          ./download.sh > /dev/null
          ./buildall.sh --clean --arch x86 mpv
          ./buildall.sh --clean --arch x86_64 mpv
          ./buildall.sh --clean --arch arm64 mpv
          ./buildall.sh --clean
        env:
          IN_CI: 1
          GRADLE_OPTS: -Xmx4G

      - name: Resolve version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.0-dev" >> "$GITHUB_ENV"
          fi

      - name: Package release assets
        run: |
          set -eux
          : "${VERSION:?VERSION is required}"
          mkdir -p out
          cp app/build/outputs/aar/app-default-release.aar "out/tadami-mpv-lib-${VERSION}.aar"
          cat > out/ivy.xml <<EOF
          <ivy-module version="2.0">
            <info organisation="com.github.andarcanum" module="tadami-mpv-lib" revision="${VERSION}"/>
            <configurations>
              <conf name="default" visibility="public"/>
            </configurations>
            <publications>
              <artifact name="tadami-mpv-lib" type="aar" ext="aar" conf="default"/>
            </publications>
          </ivy-module>
          EOF
          (cd out && sha256sum "tadami-mpv-lib-${VERSION}.aar" > "tadami-mpv-lib-${VERSION}.aar.sha256")
          git archive --format=tar.gz --prefix="tadami-mpv-lib-${VERSION}/" \
            -o "out/tadami-mpv-lib-${VERSION}-sources.tar.gz" HEAD

      - name: Upload CI artifact (manual runs)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: tadami-mpv-lib
          path: out/*

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: tadami-mpv-lib ${{ github.ref_name }}
          body_path: docs/RELEASE_NOTES.md
          files: out/*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') }}
